# Separate, build-free verification of the dsh Node 18 green packages.
#
# This does NOT rebuild anything. It downloads an ALREADY-PUBLISHED release
# asset (default: latest `v*` release, or a tag you pass), boots the package
# with its own bundled Node 18, and captures a screenshot of the web UI to
# prove the UI actually renders (not just HTTP 200). The screenshot is uploaded
# as an artifact; the job fails if the page is blank or never reaches HTTP 200.
#
# Trigger: manual dispatch (pick a tag). To auto-run after each release, copy
# this file to the default branch (main) and add a `workflow_run` trigger —
# GitHub only fires `workflow_run` listeners that live on the default branch.

name: Node 18 green package — verify (screenshot)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. v0.1). Empty = latest release.'
        required: false
        default: ''
      run_id:
        description: 'Build run id to verify (download its artifacts instead of a release). Overrides tag.'
        required: false
        default: ''

permissions:
  contents: read   # only needs to read the release asset

concurrency:
  group: node18-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  # This workflow has NO checkout step (it only downloads a published release),
  # so `gh` cannot auto-detect the repo from a .git dir. Pin GH_REPO + token
  # explicitly so every `gh` call works without git.
  GH_REPO: dragondjf/dsh-harness
  GH_TOKEN: ${{ github.token }}

jobs:
  verify:
    name: verify ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,   runner: ubuntu-latest,    ext: tar.gz, target: linux-x64 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, ext: tar.gz, target: linux-arm64 }
          - { platform: macos-arm64, runner: macos-latest,     ext: tar.gz, target: darwin-arm64 }
          - { platform: windows-x64, runner: windows-latest,   ext: tar.gz, target: win32-x64 }

    steps:
      - name: Setup Node (for Playwright + helpers)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Resolve source (release tag or build run_id)
        id: tag
        shell: bash
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -n "$RUN_ID" ]; then
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "mode=artifact" >> "$GITHUB_OUTPUT"
            echo "Using build run_id: $RUN_ID (download its artifacts)"
            exit 0
          fi
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/$GH_REPO/releases/latest --jq .tag_name 2>/dev/null || true)
          fi
          if [ -z "$TAG" ]; then echo "::error::no release tag found"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Download release asset
        if: steps.tag.outputs.mode == 'release'
        shell: bash
        run: |
          DL="$RUNNER_TEMP/dl"
          mkdir -p "$DL"
          gh release download "${{ steps.tag.outputs.tag }}" \
            --pattern "dsh-web-*-${{ matrix.target }}.tar.gz" \
            --dir "$DL"
          echo "DL=$DL" >> "$GITHUB_ENV"
          ls -la "$DL"

      - name: Download build artifact
        if: steps.tag.outputs.mode == 'artifact'
        shell: bash
        run: |
          DL="$RUNNER_TEMP/dl"
          mkdir -p "$DL"
          AID=""
          for attempt in $(seq 1 30); do
            AID=$(gh api "repos/$GH_REPO/actions/runs/${{ steps.tag.outputs.run_id }}/artifacts" \
              --jq ".artifacts[] | select(.name==\"dsh-node18-${{ matrix.platform }}\") | .id" 2>/dev/null | head -1)
            if [ -n "$AID" ]; then break; fi
            echo "artifact not ready yet (attempt $attempt); waiting for build to finish..."
            sleep 20
          done
          if [ -z "$AID" ]; then echo "::error::artifact dsh-node18-${{ matrix.platform }} not found for run ${{ steps.tag.outputs.run_id }}"; exit 1; fi
          echo "artifact id=$AID"
          gh api "repos/$GH_REPO/actions/artifacts/$AID/zip" > "$DL/artifact.zip"
          cd "$DL" && unzip -o artifact.zip
          echo "DL=$DL" >> "$GITHUB_ENV"
          ls -la "$DL"

      - name: Unpack (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p pkg && tar -xzf "$DL"/dsh-web-*.tar.gz -C pkg
          echo "PKG=$PWD/$(ls -d pkg/dsh-web-* | head -1 | xargs basename)" >> "$GITHUB_ENV"
          echo "PKG=$PWD/pkg/$(ls -d pkg/dsh-web-* | head -1 | xargs basename)"

      - name: Unpack (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p pkg && tar -xzf "$DL"/dsh-web-*.tar.gz -C pkg
          echo "PKG=$PWD/pkg/$(ls -d pkg/dsh-web-* | head -1 | xargs basename)" >> "$GITHUB_ENV"

      - name: Boot package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          cd "$PKG"
          export DSH_PERMISSION_MODE="danger-full-access"
          "$PKG/node/node" \
            --import "$PKG/scripts/better-sqlite3-abi-loader.mjs" \
            --import "$PKG/scripts/node18-polyfills.mjs" \
            "$PKG/app/lib/bin.js" web \
            --host 127.0.0.1 --port 3080 > /tmp/dsh.log 2>&1 &
          code=""
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "HTTP after boot: $code"
          [ "$code" = "200" ] || { echo "::error::server did not reach 200"; echo "--- dsh.log ---"; tail -30 /tmp/dsh.log; echo "--- dsh.err ---"; tail -30 /tmp/dsh.err; exit 1; }

      - name: Boot package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          $pkg = "$env:PKG"
          $node = "$pkg/node/node.exe"
          $env:DSH_PERMISSION_MODE = 'danger-full-access'
          $p = Start-Process -FilePath $node -WorkingDirectory $pkg -ArgumentList @(
            '--import', "$pkg/scripts/better-sqlite3-abi-loader.mjs",
            '--import', "$pkg/scripts/node18-polyfills.mjs",
            "$pkg/app/lib/bin.js", 'web', '--profile', 'web',
            '--patch', 'config/deepseek-official.yml',
            '--host', '127.0.0.1', '--port', '3080'
          ) -RedirectStandardOutput "$env:TEMP/dsh.log" -RedirectStandardError "$env:TEMP/dsh.err" -PassThru
          "PKG_PID=$($p.Id)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $r = Invoke-WebRequest -Uri http://127.0.0.1:3080/ -UseBasicParsing -TimeoutSec 2
                  if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) {
            Write-Error "server did not reach 200"
            Write-Output "node exists: $(Test-Path $node)"
            Write-Output "bin.js exists: $(Test-Path $pkg/app/lib/bin.js)"
            Write-Output "config exists: $(Test-Path $pkg/config/deepseek-official.yml)"
            Write-Output "=== dsh.log (stdout) ==="; Get-Content "$env:TEMP/dsh.log" -Tail 60 -ErrorAction SilentlyContinue
            Write-Output "=== dsh.err (stderr) ==="; Get-Content "$env:TEMP/dsh.err" -Tail 60 -ErrorAction SilentlyContinue
            $pr = Get-Process -Id $env:PKG_PID -ErrorAction SilentlyContinue
            Write-Output "package node alive: $(-not [string]::IsNullOrEmpty($pr))"
            exit 1
          }
          Write-Host "HTTP after boot: 200"

      - name: Install Playwright + Chromium (Linux, with deps)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.48.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Install Playwright + Chromium (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.48.0 >/dev/null 2>&1
          npx playwright install chromium

      - name: Screenshot + assert UI rendered
        shell: bash
        env:
          URL: http://127.0.0.1:3080/
          OUT: screenshot-${{ matrix.platform }}.png
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url = process.env.URL;
          const out = process.env.OUT;
          const browser = await chromium.launch({ args: ['--no-sandbox'] });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          const resp = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
          if (!resp || resp.status() !== 200) { console.error('HTTP', resp && resp.status()); process.exit(2); }
          await page.waitForSelector('body *', { timeout: 15000 });
          await page.waitForTimeout(3000);  // let the SPA mount + render
          const title = await page.title();
          const text = (await page.textContent('body')) || '';
          if (text.trim().length < 20) { console.error('page looks blank (len=' + text.trim().length + ')'); process.exit(3); }
          await page.screenshot({ path: out, fullPage: false });
          console.log('OK title=', JSON.stringify(title), 'textLen=', text.trim().length);
          await browser.close();
          EOF
          node verify.mjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-${{ matrix.platform }}
          path: screenshot-${{ matrix.platform }}.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload boot logs (Unix)
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: bootlogs-${{ matrix.platform }}
          path: |
            /tmp/dsh.log
            /tmp/dsh.err
          if-no-files-found: warn
          retention-days: 3

      - name: Upload boot logs (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: bootlogs-${{ matrix.platform }}
          path: |
            ${{ env.TEMP }}/dsh.log
            ${{ env.TEMP }}/dsh.err
          if-no-files-found: warn
          retention-days: 3

      - name: Stop server (Unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if [ -n "$PKG" ] && [ -x "$PKG/start-dsh.sh" ]; then
            cd "$PKG" && ./start-dsh.sh stop || true
          fi
          pkill -f "app/lib/bin.js" 2>/dev/null || true

      - name: Stop server (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PKG_PID -and (Get-Process -Id $env:PKG_PID -ErrorAction SilentlyContinue)) {
            Stop-Process -Id $env:PKG_PID -Force
          }
