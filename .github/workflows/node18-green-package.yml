# Build portable "green" (zero-install) dsh packages that run on Node 18.
#
# Why two Node versions:
#   * `pnpm install` MUST run under Node 18 so the native addons
#     (better-sqlite3, lightningcss, node-pty) compile against the Node 18
#     ABI — the same ABI as the bundled Node 18 runtime in the package.
#   * `pnpm build:lib` (tsc -b + tsdown/rolldown) needs Node 22+ because
#     rolldown imports node:util.styleText (Node 20.12+). It only emits plain
#     JS, which then runs fine on Node 18 at runtime.
#   * `pnpm build:web` (vite) runs on Node 18.
#
# Per platform we: checkout -> install deps on Node 18 -> build backend lib on
# Node 24 -> build frontend on Node 18 -> download the official Node 18 runtime
# and bundle it -> boot the package with its own Node 18 and health-check it ->
# package a self-contained archive. On a v* tag the archives are attached to a
# GitHub release.

name: Node 18 green package (cross-platform)

on:
  push:
    branches: [main, node18]
    tags: ['v*']
  pull_request:
    branches: [main, node18]
  workflow_dispatch:

permissions:
  contents: write   # needed only for the release job on tags

concurrency:
  group: node18-green-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE18_VERSION: '18.20.8'
  NODE24_VERSION: '24'
  PNPM_VERSION: '9.15.0'        # pnpm 10+ refuses Node 18; 9.x is the Node-18-compatible line
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,   runner: ubuntu-latest,    os: linux, arch: x64,   node_ext: tar.xz, archive_ext: tar.gz }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, os: linux, arch: arm64, node_ext: tar.xz, archive_ext: tar.gz }
          - { platform: macos-arm64, runner: macos-latest,     os: darwin, arch: arm64, node_ext: tar.gz, archive_ext: tar.gz }
          - { platform: windows-x64, runner: windows-latest,   os: win,    arch: x64,   node_ext: zip,   archive_ext: zip }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ---- Node 18 toolchain: install + runtime ABI ----
      - name: Setup Node ${{ env.NODE18_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE18_VERSION }}

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # Native addons are compiled/selected for the active Node (18) here, so
      # they match the bundled Node 18 runtime shipped in the package.
      - name: Install dependencies (Node 18)
        run: pnpm install --prefer-frozen-lockfile

      # ---- Node 24 toolchain: backend build (rolldown needs Node 22+) ----
      - name: Setup Node ${{ env.NODE24_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE24_VERSION }}

      - name: Build backend lib (Node 24)
        run: pnpm run build:lib

      # ---- Back to Node 18 for frontend build + runtime ----
      - name: Setup Node ${{ env.NODE18_VERSION }} (again)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE18_VERSION }}

      - name: Build frontend (Node 18, vite)
        run: pnpm run build:web

      # ---- Download the official Node 18 runtime and bundle it ----
      - name: Bundle Node 18 runtime
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ env.NODE18_VERSION }}"
          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"
          EXT="${{ matrix.node_ext }}"
          URL="https://nodejs.org/dist/v${VER}/node-v${VER}-${OS}-${ARCH}.${EXT}"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o node-dist."${EXT}"
          rm -rf node-runtime node18
          mkdir -p node-runtime
          tar -xf "node-dist.${EXT}" -C node-runtime
          mv "node-runtime/node-v${VER}-${OS}-${ARCH}" node18
          rm -rf node-runtime "node-dist.${EXT}"
          if [ "$OS" = "win" ]; then
            test -f node18/node.exe && echo "node.exe OK: $(node18/node.exe --version)"
          else
            node18/bin/node --version
          fi

      # ---- Assemble the green package tree (repo minus .git/src, plus node18/) ----
      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          PKG="dsh-node18-${{ matrix.platform }}"
          rm -rf "$PKG" && mkdir -p "$PKG"
          # Copy the repo, dropping git history, CI-only dirs, and source trees
          # (runtime only needs built lib/ + dist/ + node_modules). The bundled
          # node18 is added separately below.
          tar -cf - \
            --exclude='.git' --exclude='.github' --exclude='node18' \
            --exclude='*/src' --exclude='node_modules/.cache' \
            --exclude='coverage' --exclude='dist-exe' --exclude='dist-python' \
            . | (cd "$PKG" && tar -xf -)
          mv node18 "$PKG/node18"
          cat > "$PKG/README.md" <<'EOF'
          # dsh — Node 18 green package (${{ matrix.platform }})

          Self-contained: includes its own Node 18 runtime, so no Node install
          is required on the target machine.

          ## Run (Linux / macOS)
              cd dsh-node18-${{ matrix.platform }}
              ./start-dsh.sh                 # web UI on http://127.0.0.1:3080
              DSH_PORT=8080 ./start-dsh.sh   # custom port

          ## Run (Windows, PowerShell)
              cd dsh-node18-${{ matrix.platform }}
              pwsh ./scripts/start-dsh.ps1

          ## Configure the LLM provider
          The default overlay is config/deepseek-official.yml, which reads the
          API key from the DEEPSEEK_API_KEY environment variable:
              export DEEPSEEK_API_KEY=...    # then start
          EOF
          echo "Package tree (top):"
          ls -la "$PKG"

      # ---- Startup test: boot with the BUNDLED Node 18 and health-check ----
      - name: Startup test — boot + health (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          PKG="dsh-node18-${{ matrix.platform }}"
          cd "$PKG"
          export DSH_NODE_BIN="$PWD/node18/bin/node"
          export DSH_FOREGROUND=0
          export DSH_PERMISSION_MODE="${DSH_PERMISSION_MODE:-danger-full-access}"
          ./start-dsh.sh start
          code=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/dsh.html -w '%{http_code}' http://127.0.0.1:3080/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "::error::server did not reach HTTP 200 (last=$code)"
            tail -n 30 /tmp/dsh-3080.log || true
            ./start-dsh.sh stop || true
            exit 1
          fi
          grep -qi '<html' /tmp/dsh.html || { echo "::error::index is not HTML"; exit 1; }
          echo "smoke OK: HTTP 200 + HTML served"
          ./start-dsh.sh stop

      - name: Startup test — boot + health (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "dsh-node18-${{ matrix.platform }}"
          $node = "$PWD/$pkg/node18/node.exe"
          $log = "$env:TEMP/dsh.log"
          $err = "$env:TEMP/dsh.err"
          $env:DSH_PERMISSION_MODE = 'danger-full-access'
          $p = Start-Process -FilePath $node -WorkingDirectory "$PWD/$pkg" -ArgumentList @(
            '--import', "$PWD/$pkg/scripts/better-sqlite3-abi-loader.mjs",
            '--import', "$PWD/$pkg/scripts/node18-polyfills.mjs",
            'apps/cli/lib/bin.js', '--profile', 'web',
            '--patch', 'config/deepseek-official.yml',
            '--host', '127.0.0.1', '--port', '3080'
          ) -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:3080/ -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) {
            Write-Error "server did not reach HTTP 200"; Get-Content $log -Tail 30; $p | Stop-Process -Force; exit 1
          }
          Write-Host "smoke OK: HTTP 200"
          $p | Stop-Process -Force
          # Ensure no node process holds files before the packaging step.
          Get-Process -Name node -ErrorAction SilentlyContinue | Stop-Process -Force

      # ---- Optional: full tool-call e2e (only when the API key secret exists) ----
      # NOTE: `if` cannot see a step's own `env:`, so gate on the secret directly.
      - name: E2E tool-call suite (needs DEEPSEEK_API_KEY_EXTERNAL)
        if: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL != '' }}
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: pnpm run test:e2e

      # ---- Package the archive ----
      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "dsh-node18-${{ matrix.platform }}.tar.gz" -C "dsh-node18-${{ matrix.platform }}" .

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dsh-node18-${{ matrix.platform }}\*" -DestinationPath "dsh-node18-${{ matrix.platform }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsh-node18-${{ matrix.platform }}
          path: dsh-node18-${{ matrix.platform }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
