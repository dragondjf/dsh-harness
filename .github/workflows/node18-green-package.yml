# Build portable "green" (zero-install) dsh packages via `pnpm deploy --prod`.
#
# Route: instead of copying the 2.7 GB pnpm workspace node_modules (a symlink
# forest that explodes archive speed on NTFS and stalls the Windows job), deploy
# a flat, hoisted, symlink-free, production-only closure with `pnpm deploy
# --prod` (the same mechanism scripts/build-exe-for-python-sdk.ts uses for the
# Python SDK carrier). The closure carries pre-built lib/ artifacts and the web
# frontend dist (resolved at runtime via @deepseek-ai/dsh-web-frontend). The
# whole pipeline lives in scripts/build-green-package.ts.
#
# Per platform we: checkout -> install deps (Node 22) -> build backend lib
# (Node 22) -> recompile native addons for Node 18 ABI -> build frontend
# (Node 18) -> download the official Node 18 runtime -> run the green-package
# build script (deploy + embed Node + rebuild better-sqlite3 + launchers +
# archive) -> boot the package with its own Node 18 and health-check it. On a
# v* tag the archives are attached to a GitHub release.

name: Node 18 green package (pnpm deploy)

on:
  push:
    branches: [main, node18]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed only for the release job on tags

concurrency:
  group: node18-green-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE18_VERSION: '18.20.8'
  NODE22_VERSION: '22'
  # pnpm 9.x is the only line that runs on BOTH Node 18 (native-addon ABI
  # build) and Node 22 (rolldown backend build). pnpm 10+ requires Node >=22.13
  # and therefore cannot drive the Node-18 install step. Must match
  # package.json packageManager to avoid ERR_PNPM_BAD_PM_VERSION.
  PNPM_VERSION: '9.15.0'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,   runner: ubuntu-latest,    os: linux, arch: x64,   node_ext: tar.xz, target: linux-x64 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, os: linux, arch: arm64, node_ext: tar.xz, target: linux-arm64 }
          - { platform: macos-arm64, runner: macos-latest,     os: darwin, arch: arm64, node_ext: tar.gz, target: darwin-arm64 }
          - { platform: windows-x64, runner: windows-latest,   os: win,    arch: x64,   node_ext: zip,   target: win32-x64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ---- pnpm: single version that runs on both Node 18 and Node 22 ----
      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # ---- Node 22 toolchain: install deps + backend build ----
      - name: Setup Node ${{ env.NODE22_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE22_VERSION }}

      - name: Install dependencies (Node 22)
        run: pnpm install --no-lockfile

      - name: Build backend lib (Node 22)
        run: pnpm run build:lib

      # ---- Node 18 toolchain: recompile native addons + frontend build ----
      - name: Setup Node ${{ env.NODE18_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE18_VERSION }}

      - name: Recompile native addons for Node 18 ABI
        run: pnpm rebuild better-sqlite3 node-pty lightningcss

      - name: Build frontend (Node 18, vite)
        run: pnpm run build:web

      # ---- Download the official Node 18 runtime and bundle it ----
      - name: Bundle Node 18 runtime
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ env.NODE18_VERSION }}"
          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"
          EXT="${{ matrix.node_ext }}"
          URL="https://nodejs.org/dist/v${VER}/node-v${VER}-${OS}-${ARCH}.${EXT}"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o node-dist."${EXT}"
          rm -rf node-runtime node18
          mkdir -p node-runtime
          if [ "$OS" = "win" ]; then
            powershell -NoProfile -Command "Expand-Archive -Path node-dist.${EXT} -DestinationPath node-runtime -Force"
          else
            tar -xf "node-dist.${EXT}" -C node-runtime
          fi
          mv "node-runtime/node-v${VER}-${OS}-${ARCH}" node18
          rm -rf node-runtime "node-dist.${EXT}"
          if [ "$OS" = "win" ]; then
            test -f node18/node.exe && echo "node.exe OK: $(node18/node.exe --version)"
          else
            node18/bin/node --version
          fi

      # ---- Build the green package (deploy closure + embed Node + archive) ----
      - name: Build green package
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/build-green-package.ts \
            --target "${{ matrix.target }}" \
            --node "$PWD/node18" \
            --skip-smoke
          echo "ARTIFACT=$(ls dist-green/dsh-web-*.tar.gz | head -1)" >> "$GITHUB_ENV"

      # ---- Startup test: boot with the BUNDLED Node 18 and health-check ----
      - name: Startup test — boot + health
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          PKG=$(ls -d dist-green/dsh-web-* | head -1)
          echo "PKG=$PKG"
          NODE_BIN="$PKG/node/node"
          if [ ! -x "$NODE_BIN" ]; then NODE_BIN="$PKG/node/node.exe"; fi
          export DSH_PERMISSION_MODE="danger-full-access"
          cd "$PKG/app"
          "$NODE_BIN" \
            --import "$PKG/scripts/better-sqlite3-abi-loader.mjs" \
            --import "$PKG/scripts/node18-polyfills.mjs" \
            "$PKG/app/lib/bin.js" web \
            --profile web \
            --patch config/deepseek-official.yml \
            --host 127.0.0.1 --port 3080 > /tmp/dsh.log 2>&1 &
          code=""
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "HTTP after boot: $code"
          if [ "$code" != "200" ]; then
            echo "::error::server did not reach 200"
            echo "--- dsh.log ---"; tail -30 /tmp/dsh.log
            exit 1
          fi

      # ---- Upload the green package archive ----
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsh-node18-${{ matrix.platform }}
          path: dist-green/dsh-web-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
